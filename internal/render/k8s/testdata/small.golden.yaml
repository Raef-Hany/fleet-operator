- apiVersion: v1
  kind: Namespace
  metadata:
    labels:
      app.kubernetes.io/managed-by: fleet-operator
      fleet.example.com/ring: prod
      fleet.example.com/tenant: acme
    name: inst-acme
  spec: {}
  status: {}
- apiVersion: v1
  kind: ServiceAccount
  metadata:
    labels:
      app.kubernetes.io/managed-by: fleet-operator
      fleet.example.com/ring: prod
      fleet.example.com/tenant: acme
    name: podinfo
    namespace: inst-acme
- apiVersion: v1
  kind: ResourceQuota
  metadata:
    labels:
      app.kubernetes.io/managed-by: fleet-operator
      fleet.example.com/ring: prod
      fleet.example.com/tenant: acme
    name: quota
    namespace: inst-acme
  spec:
    hard:
      limits.cpu: "1"
      limits.memory: 1Gi
      pods: "5"
      requests.cpu: 500m
      requests.memory: 512Mi
  status: {}
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    labels:
      app.kubernetes.io/managed-by: fleet-operator
      fleet.example.com/ring: prod
      fleet.example.com/tenant: acme
    name: default-deny
    namespace: inst-acme
  spec:
    podSelector: {}
    policyTypes:
    - Ingress
    - Egress
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    labels:
      app.kubernetes.io/managed-by: fleet-operator
      fleet.example.com/ring: prod
      fleet.example.com/tenant: acme
    name: allow-podinfo
    namespace: inst-acme
  spec:
    egress:
    - ports:
      - port: 53
        protocol: TCP
      - port: 53
        protocol: UDP
      to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
    ingress:
    - from:
      - podSelector: {}
      ports:
      - port: 9898
        protocol: TCP
    podSelector:
      matchLabels:
        app.kubernetes.io/name: podinfo
    policyTypes:
    - Ingress
    - Egress
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    labels:
      app.kubernetes.io/managed-by: fleet-operator
      app.kubernetes.io/name: podinfo
      fleet.example.com/ring: prod
      fleet.example.com/tenant: acme
    name: podinfo
    namespace: inst-acme
  spec:
    replicas: 1
    selector:
      matchLabels:
        app.kubernetes.io/name: podinfo
    strategy: {}
    template:
      metadata:
        labels:
          app.kubernetes.io/managed-by: fleet-operator
          app.kubernetes.io/name: podinfo
          fleet.example.com/ring: prod
          fleet.example.com/tenant: acme
      spec:
        containers:
        - image: ghcr.io/stefanprodan/podinfo:6.7.1
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          name: podinfo
          ports:
          - containerPort: 9898
            name: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
        serviceAccountName: podinfo
  status: {}
- apiVersion: v1
  kind: Service
  metadata:
    labels:
      app.kubernetes.io/managed-by: fleet-operator
      fleet.example.com/ring: prod
      fleet.example.com/tenant: acme
    name: podinfo
    namespace: inst-acme
  spec:
    ports:
    - port: 9898
      protocol: TCP
      targetPort: http
    selector:
      app.kubernetes.io/name: podinfo
    type: ClusterIP
  status:
    loadBalancer: {}
