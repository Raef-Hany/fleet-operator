name: CI
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  test:
    name: Unit + envtest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Run tests (renderers, envtest reconciler, API validation)
        run: make test

  terraform-validate:
    name: terraform validate (synth only, never apply)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [none, psc, privatelink]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - uses: hashicorp/setup-terraform@v3
      - name: Validate the golden synthesized output for mode ${{ matrix.mode }}
        run: |
          mkdir work && cp internal/render/tf/testdata/${{ matrix.mode }}.cdk.tf.json work/cdk.tf.json
          cd work && terraform init -backend=false -input=false && terraform validate

  images:
    name: Build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - run: docker build -t fleet-operator:ci .
      - run: docker build -t fleet-operator-tfrender:ci -f Dockerfile.tfrender .

  e2e:
    name: kind e2e
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with: { go-version-file: go.mod }
      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind && sudo mv ./kind /usr/local/bin/kind
      - name: Run e2e
        run: make e2e
